services:
  database:
    image: mysql:8.0
    container_name: webdev_1-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3309:3306"
    volumes:
      - webdev_1-db-data:/var/lib/mysql
    networks:
      - webdev-network

  phpmyadmin:
    image: phpmyadmin
    container_name: webdev_1-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: database
    ports:
      - "8084:80"
    depends_on:
      - database
    networks:
      - webdev-network

volumes:
  webdev_1-db-data:

networks:
  webdev-network:
    driver: bridge
